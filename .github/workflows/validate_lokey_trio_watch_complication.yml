name: Validate Trio Watch Complication (no upload)

on:
  push:
    branches:
      - 'fix/lokey-trio-watch-complication-slots'
    paths:
      - 'Trio Watch Complication/**'
      - 'Trio Watch App Extension/WatchState.swift'
      - 'Trio Watch App/**'
      - 'Trio/Sources/Services/WatchManager/AppleWatchManager.swift'
      - 'Trio.xcodeproj/project.pbxproj'
      - '.github/workflows/validate_lokey_trio_watch_complication.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Trio Watch Complication/**'
      - 'Trio Watch App Extension/WatchState.swift'
      - 'Trio Watch App/**'
      - 'Trio/Sources/Services/WatchManager/AppleWatchManager.swift'
      - 'Trio.xcodeproj/project.pbxproj'
      - '.github/workflows/validate_lokey_trio_watch_complication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch-complication:
    name: Compile watchOS complication without signing
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout repository and pinned submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Select Xcode 26.5
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
      - name: Verify all supported Watch families are implemented
        run: |
          grep -Fq 'case .accessoryCircular:' 'Trio Watch Complication/TrioWatchComplication.swift'
          grep -Fq 'case .accessoryCorner:' 'Trio Watch Complication/TrioWatchComplication.swift'
          grep -Fq 'case .accessoryRectangular:' 'Trio Watch Complication/TrioWatchComplication.swift'
          grep -Fq 'case .accessoryInline:' 'Trio Watch Complication/TrioWatchComplication.swift'
          xcrun swiftc -frontend -parse 'Trio Watch Complication/TrioWatchComplication.swift'
          xcrun swiftc -frontend -parse 'Trio Watch App Extension/WatchState.swift'
          xcrun swiftc -frontend -parse 'Trio/Sources/Services/WatchManager/AppleWatchManager.swift'
          plutil -lint 'Trio Watch Complication/Info.plist' 'Trio Watch App/LoKeyWatchApp.entitlements' 'Trio Watch Complication/LoKeyWatchComplication.entitlements'
          grep -Fq 'loKeyTrioComplication' 'Trio Watch App Extension/WatchState.swift'
          grep -Fq 'updateApplicationContext' 'Trio/Sources/Services/WatchManager/AppleWatchManager.swift'
          grep -Fq 'CODE_SIGN_ENTITLEMENTS = "Trio Watch App/LoKeyWatchApp.entitlements"' Trio.xcodeproj/project.pbxproj
      - name: Compile complication target for watchOS simulator (no signing or upload)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Trio.xcodeproj \
            -target 'Trio Watch Complication Extension' \
            -configuration Debug \
            -sdk watchsimulator \
            CODE_SIGNING_ALLOWED=NO \
            build > watch-complication-build.log 2>&1 || { tail -n 130 watch-complication-build.log; exit 1; }
          tail -n 30 watch-complication-build.log
      - name: Compile Watch app and shared data receiver (no signing or upload)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Trio.xcodeproj \
            -target 'Trio Watch App' \
            -configuration Debug \
            -sdk watchsimulator \
            CODE_SIGNING_ALLOWED=NO \
            build > watch-app-build.log 2>&1 || { grep 'error:' watch-app-build.log | tail -n 30; tail -n 130 watch-app-build.log; exit 1; }
          tail -n 25 watch-app-build.log
      - name: Compile complete iPhone Trio scheme with Watch bundle (no signing or upload)
        shell: bash
        run: |
          set -o pipefail
          # The other steps compile the watch targets, but this change also
          # touches the iPhone WatchConnectivity manager. Verify it builds
          # together with the embedded watch app, without creating an IPA.
          xcodebuild \
            -project Trio.xcodeproj \
            -scheme Trio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LoKeyTrioWatchValidation.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive > trio-watch-full-build.log 2>&1 || { grep -E 'error:|BUILD FAILED|failed' trio-watch-full-build.log | tail -n 50; tail -n 120 trio-watch-full-build.log; exit 1; }
          tail -n 35 trio-watch-full-build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trio-watch-complication-build-log
          path: |
            watch-complication-build.log
            watch-app-build.log
            trio-watch-full-build.log
          if-no-files-found: ignore
          retention-days: 7
