name: Validate LoKey Trio Home Widget (no upload)

on:
  pull_request:
    branches: [main]
    paths:
      - 'LiveActivity/**'
      - 'Trio/Sources/Services/LiveActivity/**'
      - 'Trio.xcodeproj/**'
      - '.github/workflows/validate_lokey_trio_widget.yml'
  workflow_dispatch:

# Avoid duplicate push + PR simulator builds on the same change.
# Explicit workflow_dispatch still allows testing before a PR when needed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator-build:
    name: Compile medium widget extension without signing
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out feature branch with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Select matching Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
      - name: Confirm toolchain
        run: xcodebuild -version
      - name: Verify Trio-side glucose handoff source (no signing)
        run: |
          # The extension-only build below does not compile the app's manager.
          # Parse the app-side Swift and assert the refreshed data flow exists.
          xcrun swiftc -frontend -parse Trio/Sources/Services/LiveActivity/LiveActivityManager.swift
          grep -Fq 'await self?.loadGlucose(forceWidgetReload: true)' Trio/Sources/Services/LiveActivity/LiveActivityManager.swift
          grep -Fq 'await pushCurrentContent(forceWidgetReload: forceWidgetReload)' Trio/Sources/Services/LiveActivity/LiveActivityManager.swift
          grep -Fq 'LoKeyTrioMediumContentState.v1.json' Trio/Sources/Services/LiveActivity/LiveActivityManager.swift
          grep -Fq 'LoKeyTrioMediumContentState.v1.json' LiveActivity/LiveActivityBundle.swift
      - name: Compile existing WidgetKit extension (no signing, no TestFlight)
        run: |
          set -o pipefail
          # Build only the WidgetKit target, avoiding Trio's scheme-wide
          # watchOS-only LoopKit/WatchKit buildables on an iOS Simulator.
          # This validates the actual Home Screen widget Swift source.
          xcodebuild \
            -project Trio.xcodeproj \
            -target LiveActivityExtension \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=4MC7LCXJ5W \
            build | tee lokey-widget-build.log
        shell: bash
      - name: Upload build diagnostics only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lokey-widget-build-log
          path: lokey-widget-build.log
          if-no-files-found: ignore
          retention-days: 7
